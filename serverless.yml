org: breenie
app: ldsc
service: ldsc-webcam
frameworkVersion: "4"
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: "eu-west-1"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObjectAcl
            - s3:GetObject
            - s3:GetObjectTagging
            - s3:DeleteObject
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:PutObjectTagging
          Resource:
            - arn:aws:s3:::${self:provider.s3.archived.name}/*
            - arn:aws:s3:::${self:provider.s3.email.name}/*
            - arn:aws:s3:::${self:provider.s3.failed.name}/*
            - arn:aws:s3:::${self:provider.s3.processed.name}/*
            - arn:aws:s3:::${self:provider.s3.source.name}/*

  s3:
    email:
      name: ${self:service}-${self:provider.stage}-email
    source:
      name: ${self:service}-${self:provider.stage}-source
    processed:
      name: ${self:service}-${self:provider.stage}-processed
    archived:
      name: ${self:service}-${self:provider.stage}-archived
    failed:
      name: ${self:service}-${self:provider.stage}-failed

functions:
  email:
    environment:
      SOURCE_BUCKET: ${self:provider.s3.source.name}
    events:
      - s3:
          bucket: email
          event: s3:ObjectCreated:*
    handler: src/handlers/email.handler

  source:
    environment:
      PROCESSED_BUCKET: ${self:provider.s3.processed.name}
      FAILED_BUCKET: ${self:provider.s3.failed.name}
      MEAN_THRESHOLD: 18500
    events:
      - s3:
          bucket: source
          event: s3:ObjectCreated:*
    handler: src/handlers/source.handler
    layers:
      - arn:aws:lambda:eu-west-1:162910861850:layer:image-magick:1

  processed:
    environment:
      ARCHIVED_BUCKET: ${self:provider.s3.archived.name}
    events:
      - s3:
          bucket: processed
          event: s3:ObjectCreated:*
    handler: src/handlers/processed.handler

build:
  esbuild: false

plugins:
  - serverless-webpack

resources:
  Description: ${self:service} ${self:provider.stage}
  Resources:
    S3BucketArchived:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.s3.archived.name}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false

    S3BucketFailed:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.s3.failed.name}

    S3BucketEmail:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.s3.email.name}
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldObjects
              Status: Enabled
              ExpirationInDays: 30
              Prefix: ""

    EmailBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:provider.s3.email.name}
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowSESPuts
              Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action: s3:PutObject
              Resource: arn:aws:s3:::${self:provider.s3.email.name}/*
              Condition:
                StringEquals:
                  "aws:Referer": !Sub ${AWS::AccountId}

    EmailLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        RetentionInDays: "7"

    SourceLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        RetentionInDays: "7"

    ProcessedLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        RetentionInDays: "7"

    ArchivedOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-archived
          Description: Access to archived S3 bucket
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    ArchivedCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${self:provider.stage}-archived
          DefaultTTL: 2592000
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
            HeadersConfig:
              HeaderBehavior: none
            CookiesConfig:
              CookieBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none

    ArchivedLatestCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${self:provider.stage}-archived-latest
          DefaultTTL: 60
          MaxTTL: 60
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
            HeadersConfig:
              HeaderBehavior: none
            CookiesConfig:
              CookieBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none

    ArchivedDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service}-${self:provider.stage}-archived

          Origins:
            - Id: ArchivedS3Origin
              DomainName:
                Fn::GetAtt:
                  - S3BucketArchived
                  - RegionalDomainName
              OriginAccessControlId:
                Ref: ArchivedOriginAccessControl
              S3OriginConfig:
                OriginAccessIdentity: ""

          DefaultCacheBehavior:
            TargetOriginId: ArchivedS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId:
              Ref: ArchivedCachePolicy

          CacheBehaviors:
            - PathPattern: "*/latest.*"
              TargetOriginId: ArchivedS3Origin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods:
                - GET
                - HEAD
              CachedMethods:
                - GET
                - HEAD
              Compress: true
              CachePolicyId:
                Ref: ArchivedLatestCachePolicy

    ArchivedBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: S3BucketArchived
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::${self:provider.s3.archived.name}/*
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    Fn::Join:
                      - ""
                      - - "arn:aws:cloudfront::"
                        - Ref: AWS::AccountId
                        - ":distribution/"
                        - Ref: ArchivedDistribution

  Outputs:
    ArchivedDistributionDomain:
      Description: CloudFront distribution domain
      Value:
        Fn::GetAtt:
          - ArchivedDistribution
          - DomainName
